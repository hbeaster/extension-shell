replicaCount: 2

image:
  repository: shell
  tag: ""            # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: shell.local
  path: /
  pathType: Prefix
  tls: []
  # tls:
  #   - secretName: shell-tls
  #     hosts:
  #       - shell.local

# Optional: mount prebuilt extension assets instead of baking them into the
# image with Dockerfile.extensions. The volume MUST contain an assembled
# extensions dist — one folder per extension holding package.json, extension.js
# and icon.svg — exactly what `node scripts/build-all.mjs` writes to
# extensions/dist/. There is no index or registry file; the folders themselves
# are what the shell discovers.
#
# Mounted over /app/wwwroot/extensions, so the shell serves it with no extra
# configuration. Use the plain shell image in this mode: mounting shadows any
# extensions baked into a layered (shell-ext) image.
#
# Whatever populates the volume must clear it first — a folder left behind by a
# removed extension is still discovered and still shows up in the sidebar.
extensions:
  enabled: false
  # Raw volume spec, passed through verbatim. Any volume type works.
  volume: {}
  #   persistentVolumeClaim:
  #     claimName: shell-extensions
  # Optional subdirectory within the volume that holds the dist.
  subPath: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10

env: []
# env:
#   - name: ASPNETCORE_ENVIRONMENT
#     value: Production

podAnnotations: {}

podSecurityContext: {}
# podSecurityContext:
#   fsGroup: 1654        # so the `app` user can read a root-owned volume

nodeSelector: {}
tolerations: []
affinity: {}

replicaCount: 2

image:
  repository: extensions
  tag: ""            # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: extensions.local
  path: /
  pathType: Prefix
  tls: []
  # tls:
  #   - secretName: extensions-tls
  #     hosts:
  #       - extensions.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10

env: []
# env:
#   - name: ASPNETCORE_ENVIRONMENT
#     value: Production

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
